<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#4f46e5">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="CRM">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <title>CRM</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand"><span class="brand-mark">C</span><span id="brand-name">Moje CRM</span></div>
      <nav class="nav" id="nav-side" aria-label="Hlavní navigace"></nav>
    </aside>

    <main class="main">
      <header class="topbar">
        <div class="topbar-title">
          <a id="back" class="icon-btn" href="#/" hidden aria-label="Zpět"></a>
          <h1 id="page-title"></h1>
        </div>
        <div id="page-actions" class="topbar-actions"></div>
      </header>
      <div id="view" class="view"></div>
    </main>

    <nav class="tabbar" id="nav-tab" aria-label="Hlavní navigace"></nav>
  </div>

  <dialog id="modal" class="modal"></dialog>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <!-- Pořadí je důležité: store → ui → schema → components → views → app -->
  <script src="js/store.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/schema.js"></script>
  <script src="js/components.js"></script>
  <script src="js/views/dashboard.js"></script>
  <script src="js/views/contacts.js"></script>
  <script src="js/views/deals.js"></script>
  <script src="js/views/tasks.js"></script>
  <script src="js/views/invoices.js"></script>
  <script src="js/views/settings.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
