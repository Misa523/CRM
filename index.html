<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1c2940">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="CRM">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <title>CRM</title>
  <script src="js/theme.js"></script>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="appbar">
    <a class="brand" href="#/dashboard"><span class="brand-mark">C</span><span id="brand-name">Moje CRM</span></a>
    <nav class="modules" id="nav-top" aria-label="Moduly"></nav>
    <div class="appbar-right">
      <a class="appbar-btn sync" id="sync-status" href="#/settings" hidden></a>
      <button class="appbar-btn" id="theme-toggle"></button>
      <button class="appbar-btn create" id="quick-create" aria-label="Vytvořit nový záznam" aria-haspopup="true"></button>
      <a class="appbar-btn" id="settings-link" href="#/settings" aria-label="Nastavení"></a>
    </div>
  </header>
  <div class="menu" id="create-menu" hidden></div>

  <div class="page">
    <div class="pagehead" id="pagehead">
      <div class="pagehead-title">
        <a id="back" class="icon-btn" href="#/" hidden aria-label="Zpět"></a>
        <h1 id="page-title"></h1>
        <span id="page-sub" class="pagehead-sub"></span>
      </div>
      <div id="page-actions" class="pagehead-actions"></div>
    </div>
    <main id="view" class="view"></main>
  </div>

  <nav class="tabbar" id="nav-tab" aria-label="Moduly"></nav>

  <dialog id="modal" class="modal"></dialog>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <!-- Pořadí je důležité: store → ui → config → sync → files → zip → schema → components → charts → finance → planning → media → handover → views → app -->
  <script src="js/store.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/config.js"></script>
  <script src="js/sync.js"></script>
  <script src="js/files.js"></script>
  <script src="js/zip.js"></script>
  <script src="js/schema.js"></script>
  <script src="js/components.js"></script>
  <script src="js/charts.js"></script>
  <script src="js/finance.js"></script>
  <script src="js/planning.js"></script>
  <script src="js/media.js"></script>
  <script src="js/handover.js"></script>
  <script src="js/gcal.js"></script>
  <script src="js/views/dashboard.js"></script>
  <script src="js/views/contacts.js"></script>
  <script src="js/views/deals.js"></script>
  <script src="js/views/deal.js"></script>
  <script src="js/views/calendar.js"></script>
  <script src="js/views/tasks.js"></script>
  <script src="js/views/invoices.js"></script>
  <script src="js/views/finance.js"></script>
  <script src="js/views/settings.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
